<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="style.css">

        <title>Blackjack</title>
    </head>
    <body>
        <h1>Blackjack</h1>

        <div class="container">
            <h2>Dealer: <span id="dealer-score"></span></h2>
            <div id="dealer-cards">
                <img id="unrevealed-card" src="./images/BACK.png">
            </div>

            <h2>You: <span id="player-score"></span></h2>
            <div id="player-cards"></div>

            <br>

            <button type="button" id="hit-button">Hit</button>
            <button type="button" id="stay-button">Stay</button>

            <p id="result"></p>
            
            <br>
        </div>

        <script src="script.js"></script>
    </body>
</html>
